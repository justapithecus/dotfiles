# tmux.conf — managed by dotfiles
# ─────────────────────────────────────────────────────────────────

# ── Sensible defaults ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# ── Voice keybindings ────────────────────────────────────────────
# prefix + v → start voice recording
# prefix + y → stop recording, transcribe, copy to clipboard
bind v run-shell "voice-record start"
bind y run-shell "voice-record stop"

# ── Local overrides ──────────────────────────────────────────────
if-shell "[ -f ~/.config/tmux/tmux.local.conf ]" {
  source-file ~/.config/tmux/tmux.local.conf
}
