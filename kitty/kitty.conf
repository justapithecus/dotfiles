# ----------------------------
# Font
# ----------------------------
font_family      DMMono Nerd Font
font_size        16

# ----------------------------
# Shell
# ----------------------------
shell            /bin/zsh

# ----------------------------
# Scrollback
# ----------------------------
scrollback_lines 200000

# ----------------------------
# Cursor
# ----------------------------
cursor_blink_interval 0.5

# ----------------------------
# Terminal
# ----------------------------
term xterm-256color

# ----------------------------
# Window
# ----------------------------
remember_window_size  no
initial_window_width  120c
initial_window_height 40c
bold_is_bright        yes

# ----------------------------
# Tab bar
# ----------------------------
tab_bar_style         powerline
tab_title_template    "{fmt.fg.tab}{title}"

# ----------------------------
# Color scheme — High Contrast Dark
# (ported from konsole/colorschemes/HighContrastDark.colorscheme)
# ----------------------------

background #000000
foreground #e6e6e6

# black
color0  #000000
color8  #787878

# red
color1  #ff5555
color9  #ff6e6e

# green
color2  #50fa7b
color10 #64ffa0

# yellow
color3  #f1fa8c
color11 #ffffa0

# blue
color4  #8be9fd
color12 #a0dcff

# magenta
color5  #ff79c6
color13 #ffa0dc

# cyan
color6  #8be9fd
color14 #a0ffff

# white
color7  #e6e6e6
color15 #ffffff
